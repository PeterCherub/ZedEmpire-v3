<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b090f">
<title>ZED EMPIRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="420" height="720"></canvas>
  </div>

  <div id="boot">
    <div id="boot-mark"></div>
    <div id="boot-title">ZED EMPIRE</div>
    <div id="boot-bar"><div id="boot-bar-fill"></div></div>
    <div id="boot-tag">WE ARE SHAPED &nbsp;·&nbsp; BY THE CHOIES &nbsp;·&nbsp; WE MAKE IN LIFE</div>
  </div>

  <div id="feedback-overlay" class="hidden">
    <div id="feedback-panel">
      <div id="feedback-title">SEND FEEDBACK TO THE ADMIN</div>
      <textarea id="feedback-message" maxlength="2000" placeholder="What's on your mind? Bug reports, ideas, anything."></textarea>
      <input id="feedback-name" type="text" maxlength="60" placeholder="Your name (optional)">
      <input id="feedback-contact" type="text" maxlength="120" placeholder="Email or phone, if you want a reply (optional)">
      <div id="feedback-status"></div>
      <div id="feedback-buttons">
        <button id="feedback-cancel" type="button">CANCEL</button>
        <button id="feedback-send" type="button">SEND</button>
      </div>
    </div>
  </div>

  <div id="playername-overlay" class="hidden">
    <div id="playername-panel">
      <div id="playername-title">YOUR NAME ON THE LEADERBOARD</div>
      <input id="playername-input" type="text" maxlength="24" placeholder="e.g. Mwansa">
      <div id="playername-status"></div>
      <div id="playername-buttons">
        <button id="playername-cancel" type="button">CANCEL</button>
        <button id="playername-save" type="button">SAVE</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
